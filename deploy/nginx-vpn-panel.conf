# /etc/nginx/sites-available/vpn-panel   (replace panel.example.com)
limit_req_zone $binary_remote_addr zone=vpn_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vpn_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    server_tokens off;

    location ~ ^/api/(v1/auth|admin)/login$ {
        limit_req zone=vpn_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        limit_req zone=vpn_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
