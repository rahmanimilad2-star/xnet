<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<meta name="color-scheme" content="dark">
<title>XNET · پنل مدیریت</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login-view" class="center hidden">
  <form id="login-form" class="login-card">
    <div class="login-brand">
      <div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <h1>ورود به XNET</h1>
      <p>پنل مدیریت کاربران و سرویس VPN</p>
    </div>
    <label>نام کاربری<input name="username" class="ltr" autocomplete="username" required></label>
    <label>رمز عبور<input name="password" class="ltr" type="password" autocomplete="current-password" required></label>
    <p class="error" id="login-error"></p>
    <button class="btn primary block" type="submit">ورود</button>
  </form>
</div>

<div id="app-view" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <div><div class="brand-name">XNET</div><div class="brand-sub">VPN Control Panel</div></div>
    </div>
    <div class="nav-label">منوی اصلی</div>
    <nav>
      <a data-page="dashboard" class="active"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="lb">داشبورد</span></a>
      <a data-page="users"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="lb">کاربران</span></a>
      <a data-page="servers"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/></svg><span class="lb">سرورها</span></a>
      <a data-page="configs"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span class="lb">لینک‌ها و کانفیگ‌ها</span></a>
      <a data-page="groups"><svg class="i" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg><span class="lb">گروه‌ها</span></a>
    </nav>
    <div class="nav-label">سیستم</div>
    <nav>
      <a data-page="audit"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="lb">رویدادها</span></a>
      <a data-page="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span class="lb">تنظیمات</span></a>
    </nav>
    <div class="side-foot">
      <div class="avatar" id="side-avatar">A</div>
      <div class="who"><strong id="side-admin">مدیر</strong><span>مدیر سیستم</span></div>
    </div>
  </aside>
  <div id="sidebar-backdrop"></div>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn" id="menu-toggle" aria-label="منو"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="crumb"><span>XNET</span><span>/</span><strong id="top-title">داشبورد</strong></div>
      <span class="spacer"></span>
      <span id="sys-status" class="badge plain">در حال بررسی سرورها…</span>
      <span class="top-chip"><span class="avatar" id="top-avatar">A</span><span class="who" id="admin-name"></span></span>
      <button class="btn ghost sm" id="logout-btn"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span class="lbl">خروج</span></button>
    </header>
    <main id="page" class="content"></main>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="icon-btn" id="modal-close" aria-label="بستن"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
