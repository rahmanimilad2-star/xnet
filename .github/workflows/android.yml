name: Android APK

on:
  push:
    branches: [ main, master ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "android/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 34 + Build Tools 34.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            gh release download --repo 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' --dir app/libs
          fi
          ls -la app/libs

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.14.3; fi
          chmod +x gradlew

      - name: assembleDebug
        env:
          # Optional: set a repository variable VPN_API_BASE_URL (Settings > Variables) to bake your backend URL
          VPN_API_BASE_URL: ${{ vars.VPN_API_BASE_URL }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
