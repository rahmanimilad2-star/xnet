name: Android APK

on:
  push:
    branches: [ main, master ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "android/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 34 + Build Tools 34.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            gh release download v26.9.30 --repo 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' --dir app/libs
          fi
          ls -la app/libs

      - name: Validate and decode release keystore
        env:
          VPN_KEYSTORE_B64: ${{ secrets.VPN_KEYSTORE }}
          VPN_KEYSTORE_PASSWORD: ${{ secrets.VPN_KEYSTORE_PASSWORD }}
          VPN_KEY_ALIAS: ${{ secrets.VPN_KEY_ALIAS }}
          VPN_KEY_PASSWORD: ${{ secrets.VPN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VPN_KEYSTORE_B64 VPN_KEYSTORE_PASSWORD VPN_KEY_ALIAS VPN_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done
          if ! printf '%s' "$VPN_KEYSTORE_B64" | base64 --decode > xnet-release.keystore; then
            echo "::error::VPN_KEYSTORE is not valid Base64"
            exit 1
          fi
          if [ ! -s xnet-release.keystore ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi
          chmod 600 xnet-release.keystore
          if ! keytool -list -keystore xnet-release.keystore -storepass "$VPN_KEYSTORE_PASSWORD" -alias "$VPN_KEY_ALIAS" >/dev/null; then
            echo "::error::Keystore password or key alias is invalid"
            exit 1
          fi
      - name: Build release APK
        env:
          VPN_KEYSTORE: ../xnet-release.keystore
          VPN_KEYSTORE_PASSWORD: ${{ secrets.VPN_KEYSTORE_PASSWORD }}
          VPN_KEY_ALIAS: ${{ secrets.VPN_KEY_ALIAS }}
          VPN_KEY_PASSWORD: ${{ secrets.VPN_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify release API base URL
        run: |
          expected=$(grep -E '^vpnApiBaseUrl=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          f=$(find app/build/generated -name BuildConfig.java -path '*release*' | head -1)
          grep 'API_BASE_URL' "$f"
          grep -qF "API_BASE_URL = \"$expected\"" "$f" || {
            echo "ERROR: Release API_BASE_URL does not match gradle.properties ($expected)"
            exit 1
          }

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
