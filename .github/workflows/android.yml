name: Android APK

on:
  push:
    branches: [ main, master ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "android/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 34 + Build Tools 34.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            gh release download v26.9.30 --repo 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' --dir app/libs
          fi
          ls -la app/libs

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.14.3
          fi
          chmod +x gradlew

      - name: Decode release keystore
        env:
          VPN_KEYSTORE_B64: ${{ secrets.VPN_KEYSTORE }}
        run: |
          echo "$VPN_KEYSTORE_B64" | base64 --decode > xnet-release.keystore
          chmod 600 xnet-release.keystore

      - name: Build release APK
        env:
          VPN_KEYSTORE: ../xnet-release.keystore
          VPN_KEYSTORE_PASSWORD: ${{ secrets.VPN_KEYSTORE_PASSWORD }}
          VPN_KEY_ALIAS: ${{ secrets.VPN_KEY_ALIAS }}
          VPN_KEY_PASSWORD: ${{ secrets.VPN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release API base URL
        run: |
          expected=$(grep -E '^vpnApiBaseUrl=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          f=$(find app/build/generated -name BuildConfig.java -path '*release*' | head -1)
          grep 'API_BASE_URL' "$f"
          grep -qF "API_BASE_URL = \"$expected\"" "$f" || {
            echo "ERROR: Release API_BASE_URL does not match gradle.properties ($expected)"
            exit 1
          }

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
